apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api

    spec:
      initContainers:
        - name: migrate
          image: safa-hawa-api:dev
          imagePullPolicy: Never

          command: ["sh", "-c"]

          args:
            - |
              until python -c "import socket; socket.create_connection(('postgres', 5432), 2)" 2>/dev/null; do
                echo "waiting for postgres"
                sleep 2
              done

              alembic upgrade head

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: safahawa-db
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: postgresql+psycopg://hawa:$(POSTGRES_PASSWORD)@postgres:5432/safahawa

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

      containers:
        - name: api
          image: safa-hawa-api:dev
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: safahawa-db
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: postgresql+psycopg://hawa:$(POSTGRES_PASSWORD)@postgres:5432/safahawa

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi